# Data configuration for jet classification with ParticleTransformer.

# Version for the per-jet ntuples in
# /eos/experiment/fcc/ee/analyses/case-studies/aleph/processedMC/1994/zqq/stage2/VTAG-01
# (same as data_config_parttaggerwithv0.yaml but with different branch names).
# Other differences with respect to data_config_parttaggerwithv0.yaml:
# - removed pfcand_linearSignedIP3D(Sig) and pfcand_transverse/longitudinalJetDistance
#   (not available in these ntuples).
# - increased the maximum number of V0 candidates from 5 to 10
#   (these ntuples have many more V0 candidates per jet).
# - decreased the maximum number of particles from 128 to 64
#   (no jet has more than 60 particles, and this speeds up the data loading).
# Variables marked with 'auto' are to be standardized;
# the version with fixed standardization constants (in the 'standardized' folder)
# can be made with dataset-exploration/make_standardized_config.py.

selection:
  ( ( jet_pT > 10. )
  & ( np.abs(jet_eta) < 0.9 ) )

test_time_selection:
  ( ( jet_pT > 10. )
  & ( np.abs(jet_eta) < 0.9 ) )

new_variables:
   # labels (no gluon jets in these ntuples)
   recojet_isUDG: recojet_isU + recojet_isD
   # masks
   # (note: pfcand_mask also exists as a branch, but is overridden here)
   pfcand_mask: ak.ones_like(pfcand_pt)
   sv_mask: ak.ones_like(sv_chi2_norm)
   v0_mask: ak.ones_like(v0_chi2_norm)
   # pfcand input features
   pfcand_pt_log: np.log(pfcand_pt)
   pfcand_e_log: np.log(pfcand_e)
   pfcand_drrel: np.hypot(pfcand_thetarel, pfcand_phirel)
   # sv input features
   sv_pt_proxy: np.multiply(sv_p, np.sin(sv_thetarel))
   sv_px_proxy: np.multiply(sv_pt_proxy, np.cos(sv_phirel))
   sv_py_proxy: np.multiply(sv_pt_proxy, np.sin(sv_phirel))
   sv_pz_proxy: np.multiply(sv_p, np.cos(sv_thetarel))
   sv_e_proxy: np.sqrt(np.square(sv_px_proxy) + np.square(sv_py_proxy) + np.square(sv_pz_proxy) + np.square(sv_mass))
   # v0 input features
   v0_pt_proxy: np.multiply(v0_p, np.sin(v0_thetarel))
   v0_px_proxy: np.multiply(v0_pt_proxy, np.cos(v0_phirel))
   v0_py_proxy: np.multiply(v0_pt_proxy, np.sin(v0_phirel))
   v0_pz_proxy: np.multiply(v0_p, np.cos(v0_thetarel))
   v0_e_proxy: np.sqrt(np.square(v0_px_proxy) + np.square(v0_py_proxy) + np.square(v0_pz_proxy) + np.square(v0_invM))

preprocess:
  method: manual
  data_fraction: 0.5

inputs:
   pf_points:
      length: 64
      pad_mode: wrap
      vars: 
         - [pfcand_thetarel, auto]
         - [pfcand_phirel, auto]
   pf_features:
      length: 64
      pad_mode: wrap
      vars: 
         - [pfcand_pt_log, auto]
         - [pfcand_e_log, auto]
         - [pfcand_ptrel_log, auto]
         - [pfcand_erel_log, auto]
         - [pfcand_drrel, auto]
         - [pfcand_thetarel, auto]
         - [pfcand_phirel, auto]
         - [pfcand_charge, null]
         - [pfcand_dxy, auto]
         - [pfcand_dz, auto]
         - [pfcand_btagSip2dVal, auto]
         - [pfcand_btagSip2dSig, auto]
         - [pfcand_btagSip3dVal, auto]
         - [pfcand_btagSip3dSig, auto]
         - [pfcand_btagJetDistVal, auto]
         - [pfcand_btagJetDistSig, auto]
         - [pfcand_isChargedHad, null]
         - [pfcand_isNeutralHad, null]
         - [pfcand_isGamma, null]
         - [pfcand_isEl, null]
         - [pfcand_isMu, null]
         - [pfcand_trackChi2Norm, auto]
         - [pfcand_nTrackHits_VDET, auto]
         - [pfcand_nTrackHits_ITC, auto]
         - [pfcand_nTrackHits_TPC, auto]
         - [pfcand_dEdx_pads_type, null]
         - [pfcand_dEdx_pads_value, auto]
         - [pfcand_dEdx_pads_error, auto]
         - [pfcand_dEdx_wires_type, null]
         - [pfcand_dEdx_wires_value, auto]
         - [pfcand_dEdx_wires_error, auto]
         - [pfcand_PID_pval_pads_ele, auto]
         - [pfcand_PID_pval_pads_mu, auto]
         - [pfcand_PID_pval_pads_pi, auto]
         - [pfcand_PID_pval_pads_kaon, auto]
         - [pfcand_PID_pval_pads_proton, auto]
         - [pfcand_PID_pval_wires_ele, auto]
         - [pfcand_PID_pval_wires_mu, auto]
         - [pfcand_PID_pval_wires_pi, auto]
         - [pfcand_PID_pval_wires_kaon, auto]
         - [pfcand_PID_pval_wires_proton, auto]
   pf_vectors:
      length: 64
      pad_mode: wrap
      vars: 
         - [pfcand_px, null]
         - [pfcand_py, null]
         - [pfcand_pz, null]
         - [pfcand_e, null]
   pf_mask:
      length: 64
      pad_mode: constant
      vars: 
         - [pfcand_mask, null]

   sv_points:
      length: 5
      pad_mode: constant
      vars:
         - [sv_thetarel, auto]
         - [sv_phirel, auto]
   sv_features:
      length: 5
      pad_mode: constant
      vars:
         - [sv_dx, auto]
         - [sv_dy, auto]
         - [sv_dz, auto]
         - [sv_thetarel, auto]
         - [sv_phirel, auto]
         - [sv_p, auto]
         - [sv_prel, auto]
         - [sv_ntracks, auto]
         - [sv_mass, auto]
         - [sv_correctedMass, auto]
         - [sv_dxy, auto]
         - [sv_dxyz, auto]
         - [sv_chi2, auto]
         - [sv_chi2_norm, auto]
         - [sv_cosPointing, auto]
   sv_vectors:
      length: 5
      pad_mode: constant
      vars:
         - [sv_px_proxy, null]
         - [sv_py_proxy, null]
         - [sv_pz_proxy, null]
         - [sv_e_proxy, null]
   sv_mask:
      length: 5
      pad_mode: constant
      vars:
         - [sv_mask, null]

   v0_points:
      length: 10
      pad_mode: constant
      vars:
         - [v0_thetarel, auto]
         - [v0_phirel, auto]
   v0_features:
      length: 10
      pad_mode: constant
      vars:
         - [v0_dx, auto]
         - [v0_dy, auto]
         - [v0_dz, auto]
         - [v0_thetarel, auto]
         - [v0_phirel, auto]
         - [v0_p, auto]
         - [v0_prel, auto]
         - [v0_ntracks, auto]
         - [v0_invM, auto]
         - [v0_correctedMass, auto]
         - [v0_dxy, auto]
         - [v0_dxyz, auto]
         - [v0_chi2, auto]
         - [v0_chi2_norm, auto]
         - [v0_cosPointing, auto]
   v0_vectors:
      length: 10
      pad_mode: constant
      vars:
         - [v0_px_proxy, null]
         - [v0_py_proxy, null]
         - [v0_pz_proxy, null]
         - [v0_e_proxy, null]
   v0_mask:
      length: 10
      pad_mode: constant
      vars:
         - [v0_mask, null]

labels:
   type: simple
   value: [recojet_isB, recojet_isC, recojet_isS, recojet_isUDG]

observers:
   - jet_pT
   - jet_eta
   - jet_theta
   - jet_phi
   - jet_e
   - jet_mass
   - jet_nconst

weights:
   use_precomputed_weights: false
   reweight_basewgt: np.ones(len(jet_pT))
   reweight_method: flat
   reweight_threshold: 0
   reweight_load_fraction: 1.
   reweight_vars:
      jet_pT: [0., 30000.]
      jet_e: [0., 30000.]
   reweight_discard_under_overflow: false
   reweight_classes: [recojet_isB, recojet_isC, recojet_isS, recojet_isUDG]
   class_weights: [1, 1, 1, 1]
