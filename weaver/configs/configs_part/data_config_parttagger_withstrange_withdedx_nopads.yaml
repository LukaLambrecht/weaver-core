# Data configuration for jet classification with ParticleTransformer.

selection:
  ( ( recojet_pt > 10. )
  & ( np.abs(recojet_eta) < 0.9 ) )

test_time_selection:
  ( ( recojet_pt > 10. )
  & ( np.abs(recojet_eta) < 0.9 ) )

new_variables:
   # masks
   pfcand_mask: ak.ones_like(pfcand_pt)
   sv_mask: ak.ones_like(sv_chi2Normalized)
   # pfcand input features
   pfcand_pt_log: np.log(pfcand_pt)
   pfcand_e_log: np.log(pfcand_e)
   pfcand_drrel: np.hypot(pfcand_thetarel, pfcand_phirel)
   # sv input features
   sv_pt_proxy: np.multiply(sv_p, np.sin(sv_thetarel))
   sv_px_proxy: np.multiply(sv_pt_proxy, np.cos(sv_phirel))
   sv_py_proxy: np.multiply(sv_pt_proxy, np.sin(sv_phirel))
   sv_pz_proxy: np.multiply(sv_p, np.cos(sv_thetarel))
   sv_e_proxy: np.sqrt(np.square(sv_px_proxy) + np.square(sv_py_proxy) + np.square(sv_pz_proxy) + np.square(sv_mass))

preprocess:
  method: manual
  data_fraction: 0.5

inputs:
   pf_points:
      length: 128
      pad_mode: wrap
      vars: 
         - [pfcand_thetarel, null]
         - [pfcand_phirel, null]
   pf_features:
      length: 128
      pad_mode: wrap
      vars: 
         - [pfcand_pt_log, null]
         - [pfcand_e_log, null]
         - [pfcand_ptrel_log, null]
         - [pfcand_erel_log, null]
         - [pfcand_drrel, null]
         - [pfcand_thetarel, null]
         - [pfcand_phirel, null]
         - [pfcand_charge, null]
         - [pfcand_dxy, null]
         - [pfcand_dz, null]
         - [pfcand_Sip2dVal, null]
         - [pfcand_Sip2dSig, null]
         - [pfcand_Sip3dVal, null]
         - [pfcand_Sip3dSig, null]
         - [pfcand_JetDistVal, null]
         - [pfcand_JetDistSig, null]
         - [pfcand_linearSignedIP3D, null]
         - [pfcand_linearSignedIP3DSig, null]
         - [pfcand_transverseJetDistance, null]
         - [pfcand_longitudinalJetDistance, null]
         - [pfcand_isChargedHad, null]
         - [pfcand_isNeutralHad, null]
         - [pfcand_isGamma, null]
         - [pfcand_isEl, null]
         - [pfcand_isMu, null]
         - [pfcand_trackChi2Normalized, null]
         - [pfcand_nTrackHits_VDET, null]
         - [pfcand_nTrackHits_ITC, null]
         - [pfcand_nTrackHits_TPC, null]
         - [pfcand_dEdx_wires_type, null]
         - [pfcand_dEdx_wires_value, null]
         - [pfcand_dEdx_wires_error, null]
         - [pfcand_PID_pval_wires_ele, null]
         - [pfcand_PID_pval_wires_mu, null]
         - [pfcand_PID_pval_wires_pi, null]
         - [pfcand_PID_pval_wires_kaon, null]
         - [pfcand_PID_pval_wires_proton, null]
   pf_vectors:
      length: 128
      pad_mode: wrap
      vars: 
         - [pfcand_px, null]
         - [pfcand_py, null]
         - [pfcand_pz, null]
         - [pfcand_e, null]
   pf_mask:
      length: 128
      pad_mode: constant
      vars: 
         - [pfcand_mask, null]
   sv_points:
      length: 5
      pad_mode: constant
      vars:
         - [sv_thetarel, null]
         - [sv_phirel, null]
   sv_features:
      length: 5
      pad_mode: constant
      vars:
         - [sv_xrel, null]
         - [sv_yrel, null]
         - [sv_zrel, null]
         - [sv_thetarel, null]
         - [sv_phirel, null]
         - [sv_p, null]
         - [sv_prel, null]
         - [sv_nTracks, null]
         - [sv_mass, null]
         - [sv_correctedMass, null]
         - [sv_dxy, null]
         - [sv_dxyz, null]
         - [sv_chi2, null]
         - [sv_chi2Normalized, null]
         - [sv_cosPointing, null]
   sv_vectors:
      length: 5
      pad_mode: constant
      vars:
         - [sv_px_proxy, null]
         - [sv_py_proxy, null]
         - [sv_pz_proxy, null]
         - [sv_e_proxy, null]
   sv_mask:
      length: 5
      pad_mode: constant
      vars:
         - [sv_mask, null]

labels:
   type: simple
   value: [recojet_isB, recojet_isC, recojet_isS, recojet_isUDG]

observers:
   - recojet_pt
   - recojet_eta
   - recojet_theta
   - recojet_phi
   - recojet_e
   - recojet_mass
   - nconst

weights:
   use_precomputed_weights: false
   reweight_basewgt: np.ones(len(recojet_pt))
   reweight_method: flat
   reweight_threshold: 0
   reweight_load_fraction: 1.
   reweight_vars:
      recojet_pt: [0., 30000.]
      recojet_e: [0., 30000.]
   reweight_discard_under_overflow: false
   reweight_classes: [recojet_isB, recojet_isC, recojet_isS, recojet_isUDG]
   class_weights: [1, 1, 1, 1]
